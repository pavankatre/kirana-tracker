<table mat-table [dataSource]="data()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Item Name </th>
    <td mat-cell *matCellDef="let item"> {{item.name}} </td>
  </ng-container>

  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef> Current Stock </th>
    <td mat-cell *matCellDef="let item" [ngClass]="{
        'stock-critical': item.stockCount === 0,
        'stock-low': item.stockCount > 0 && item.stockCount <= 5,
        'stock-good': item.stockCount > 5
    }"> 
      {{item.stockCount}} 
    </td>
  </ng-container>

  <ng-container matColumnDef="updated">
    <th mat-header-cell *matHeaderCellDef> Last Updated </th>
    <td mat-cell *matCellDef="let item"> {{item.lastUpdated | date:'short'}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [length]="totalItems()"
               [pageSize]="10"
               (page)="onPageChange.emit($event)">
</mat-paginator>
