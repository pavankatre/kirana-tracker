<mat-toolbar color="primary">
  <button mat-icon-button routerLink="/">
    <mat-icon>storefront</mat-icon>
  </button>
  <span>Kirana Tracker</span>

  <span class="spacer"></span>

  <div class="desktop-nav">
    <button mat-button routerLink="/dashboard" class="nav-link">
      <mat-icon>dashboard</mat-icon> Dashboard
    </button>
    <button mat-button routerLink="/inventory" class="nav-link">
      <mat-icon>list</mat-icon> Inventory
    </button>
    <button mat-button routerLink="/shopping-list" class="nav-link">
      <mat-icon>shopping_cart</mat-icon> Purchase List
    </button>
  </div>

  <button mat-icon-button [matMenuTriggerFor]="menu" class="mobile-menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/dashboard">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </button>
    <button mat-menu-item routerLink="/inventory">
      <mat-icon>list</mat-icon>
      <span>Inventory</span>
    </button>
    <button mat-menu-item routerLink="/shopping-list">
      <mat-icon>shopping_cart</mat-icon>
      <span>Purchase List</span>
    </button>
  </mat-menu>

  <button mat-icon-button>
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>
