<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Inventory Overview</h1>
    <p>Monitor your Kirana stock levels and updates at a glance.</p>
  </header>

  <section class="controls-row">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search items...</mat-label>
      <input matInput 
             [value]="tableService.searchTerm()" 
             (input)="tableService.searchTerm.set($any($event.target).value)"
             placeholder="Search by name or ID">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="category-field">
      <mat-label>Filter by Category</mat-label>
      <mat-select [value]="tableService.selectedCategory()" 
                  (selectionChange)="tableService.selectedCategory.set($event.value)">
        @for (cat of tableService.categories(); track cat) {
          <mat-option [value]="cat">{{ cat }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </section>

  <mat-card class="table-card">
    <app-item-table 
      [data]="tableService.paginatedItems()" 
      [totalItems]="tableService.filteredItems().length"
      (onPageChange)="tableService.currentPage.set($event.pageIndex)">
    </app-item-table>
  </mat-card>
</div>
