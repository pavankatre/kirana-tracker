<div class="login-wrapper">
  <div class="login-container">
    
    <div class="mascot-box">
      <div class="puppy" [class.covering-eyes]="isPasswordFocused">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>
          <div class="nose"></div>
        </div>
        <div class="hand left"></div>
        <div class="hand right"></div>
      </div>
    </div>

    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Kirana Tracker</mat-card-title>
        <p class="welcome-text">Please login to manage your store</p>
      </mat-card-header>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-card-content>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <!-- <mat-icon matPrefix>email</mat-icon>  -->
            <input matInput formControlName="email" type="email">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <!-- <mat-icon matPrefix>lock</mat-icon> -->
            <input matInput 
                   formControlName="password" 
                   type="password"
                   (focus)="isPasswordFocused = true"
                   (blur)="isPasswordFocused = false">
          </mat-form-field>
        </mat-card-content>

        <mat-card-actions>
          <button mat-raised-button color="primary" class="login-btn" type="submit"
            [style.transform]="buttonTransform"
            (mouseenter)="moveButton()"> 
            Login
          </button>
          <button mat-button class="reg-btn" type="button" (click)="goToRegister()">
            New here? Create Account
          </button>
        </mat-card-actions>
      </form>
    </mat-card>
  </div>
</div>
