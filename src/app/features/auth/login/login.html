<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Kirana Tracker Login</mat-card-title>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-card-content>
        <!-- <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="admin@kirana.com">
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <mat-error>Please enter a valid email</mat-error>
          }
        </mat-form-field> -->

        <!-- <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field> -->
        <mat-form-field appearance="outline" class="full-width">
  <mat-label>Email</mat-label>
  <input matInput formControlName="email" type="email" placeholder="admin@kirana.com">
  
  @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
    <mat-error>{{ getErrorMessage('email') }}</mat-error>
  }
</mat-form-field>

<mat-form-field appearance="outline" class="full-width">
  <mat-label>Password</mat-label>
  <input matInput formControlName="password" type="password">
  
  @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
    <mat-error>{{ getErrorMessage('password') }}</mat-error>
  }
</mat-form-field>

      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" [disabled]="loginForm.invalid" type="submit">
          Login
        </button>
        <button mat-button type="button" (click)="goToRegister()">
          Create Account
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
