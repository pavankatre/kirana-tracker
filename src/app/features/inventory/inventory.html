<app-stock-form 
  [categories]="categories()" 
  [items]="inventory.items()" 
  (onUpdate)="handleStockUpdate($event)">
</app-stock-form>


<mat-form-field appearance="outline" class="search-bar">
  <mat-label>Search Inventory (Name or Category)</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput [value]="searchTerm()" (input)="updateSearch($event)">
</mat-form-field>

<div class="inventory-grid">
  @for (item of filteredItems(); track item.id) {
    <mat-card class="item-card">
      </mat-card>
  }
</div>

<div class="inventory-grid">
  @for (item of filteredItems(); track item.id) {
    <mat-card class="item-card" [class.low-stock-alert]="item.stockCount <= item.minThreshold">
      <div class="card-accent" [style.background-color]="getStatusColor(item)"></div>
      
      <mat-card-header>
        <div mat-card-avatar class="category-icon">
          <mat-icon>{{ getCategoryIcon(item.category) }}</mat-icon>
        </div>
        <mat-card-title>{{ item.name }}</mat-card-title>
        <mat-card-subtitle>{{ item.category }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="stock-status-container">
          <div class="stock-info">
             <span class="stock-value">{{ item.stockCount }}</span>
             <span class="stock-label">Units Left</span>
          </div>
          <mat-progress-bar 
            mode="determinate" 
            [value]="(item.stockCount / 20) * 100" 
            [color]="item.stockCount <= item.minThreshold ? 'warn' : 'primary'">
          </mat-progress-bar>
        </div>
      </mat-card-content>

      <mat-card-actions align="end">
         <button mat-icon-button color="warn" (click)="inventory.consumeItem(item.id)" matTooltip="Decrease">
           <mat-icon>remove_circle_outline</mat-icon>
         </button>
         <button mat-icon-button color="primary" (click)="inventory.addStock(item.id)" matTooltip="Quick Add">
           <mat-icon>add_circle_outline</mat-icon>
         </button>
      </mat-card-actions>
    </mat-card>
  }
</div>
